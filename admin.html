<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver verification - Admin</title>
<style>
  :root { --green:#2e7d32; --blue:#1565c0; --red:#c62828; --amber:#ef6c00; --bg:#f4f6f8; --card:#fff; --line:#dde3e8; --text:#1b1f23; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181c; --card:#1e242a; --line:#323a42; --text:#e8ecef; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--blue); color:#fff; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:18px; margin:0; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  input, button, select { font:inherit; }
  input, select { padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); width:100%; }
  input[type=checkbox] { width:auto; }
  button { padding:9px 16px; border-radius:8px; border:0; cursor:pointer; background:var(--blue); color:#fff; font-weight:600; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.green { background:var(--green); } button.red { background:var(--red); }
  .tabs button { background:var(--card); color:var(--text); border:1px solid var(--line); margin:0 6px 6px 0; }
  .tabs button.on { background:var(--blue); color:#fff; border-color:var(--blue); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:top; }
  tr.row { cursor:pointer; } tr.row:hover { background:rgba(21,101,192,.08); }
  .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:700; color:#fff; }
  .DOCS_PENDING { background:#8d6e63; } .UNDER_REVIEW { background:var(--amber); } .VERIFIED { background:var(--green); } .REJECTED { background:var(--red); } .SUSPENDED { background:#455a64; }
  .docs { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; margin-top:12px; }
  .doc { border:1px solid var(--line); border-radius:10px; padding:10px; text-align:center; }
  .doc img { max-width:100%; max-height:260px; border-radius:6px; }
  .doc b { display:block; margin-bottom:8px; }
  .muted { color:#78909c; font-size:13px; }
  .actions { margin-top:16px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .form { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; margin-top:10px; }
  .form label { font-size:12px; color:#78909c; display:block; margin-bottom:3px; }
  .issues { margin:10px 0; padding:10px 14px; border-radius:10px; font-size:14px; }
  .issues.bad { background:rgba(198,40,40,.12); color:var(--red); } .issues.good { background:rgba(46,125,50,.14); color:var(--green); } .issues.warn { background:rgba(239,108,0,.14); color:var(--amber); }
  .issues ul { margin:4px 0 0 18px; padding:0; }
  #msg { color:var(--red); margin-top:8px; min-height:20px; }
  h3 { margin:18px 0 0; }
</style>
</head>
<body>
<header><h1>Driver verification</h1><span id="who" class="muted" style="color:#cfe3ff"></span></header>
<main>
  <div id="login" class="card">
    <p><b>Admin password</b></p>
    <input type="password" id="pw" placeholder="Admin password" autocomplete="current-password" style="max-width:280px">
    <button id="loginBtn">Open</button>
    <div id="msg"></div>
  </div>

  <div id="app" style="display:none">
    <div class="card">
      <div class="tabs" id="tabs"></div>
      <table>
        <thead id="thead"></thead>
        <tbody id="list"></tbody>
      </table>
      <p class="muted" id="empty" style="display:none">Nothing in this list.</p>
    </div>
    <div class="card" id="detail" style="display:none"></div>
  </div>
</main>

<script>
const TABS = [['UNDER_REVIEW','Under review'],['DOCS_PENDING','Docs pending'],['VERIFIED','Verified'],['REJECTED','Rejected'],['EXPIRING','Expiring soon'],['','All']];
let KEY = sessionStorage.getItem('adminKey') || '';
let tab = 'UNDER_REVIEW';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NAMES = { SELFIE:'Selfie', DL:'Driving licence', AADHAAR:'Aadhaar', RC:'RC book', PERMIT:'Vehicle permit', INSURANCE:'Insurance', POLICE:'Police verification', FITNESS:'Fitness certificate' };

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'x-admin-key': KEY, ...(opts.headers || {}) } });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || ('Error ' + res.status));
  return body;
}

$('loginBtn').onclick = async () => {
  KEY = $('pw').value;
  try { await api('/admin/api/drivers?status=UNDER_REVIEW'); sessionStorage.setItem('adminKey', KEY); start(); }
  catch (e) { $('msg').textContent = e.message; }
};
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });

function start() {
  $('login').style.display = 'none'; $('app').style.display = 'block'; $('who').textContent = 'Signed in';
  renderTabs(); loadList();
}

function renderTabs() {
  $('tabs').innerHTML = TABS.map(([v, l]) => `<button class="${v === tab ? 'on' : ''}" data-v="${v}">${l}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach((b) => b.onclick = () => { tab = b.dataset.v; renderTabs(); loadList(); $('detail').style.display = 'none'; });
}

async function loadList() {
  try {
    if (tab === 'EXPIRING') return loadExpiring();
    $('thead').innerHTML = '<tr><th>Driver</th><th>Phone</th><th>Vehicle</th><th>Status</th><th>Updated</th></tr>';
    const rows = await api('/admin/api/drivers' + (tab ? '?status=' + tab : ''));
    $('empty').style.display = rows.length ? 'none' : 'block';
    $('list').innerHTML = rows.map((d) => `
      <tr class="row" data-id="${esc(d.driver_id)}">
        <td><b>${esc(d.name)}</b><br><span class="muted">${esc(d.driver_id)}</span></td>
        <td>${esc(d.phone)}</td>
        <td>${esc(d.vehicle_type)}<br><span class="muted">${esc(d.vehicle_number)}</span></td>
        <td><span class="badge ${esc(d.status)}">${esc(d.status.replace('_', ' '))}</span>${d.police_verified ? ' <span class="muted">police ✓</span>' : ''}</td>
        <td class="muted">${new Date(d.updated_at).toLocaleString()}</td>
      </tr>`).join('');
    $('list').querySelectorAll('tr.row').forEach((r) => r.onclick = () => openDriver(r.dataset.id));
  } catch (e) { alert(e.message); }
}

async function loadExpiring() {
  $('thead').innerHTML = '<tr><th>Driver</th><th>Phone</th><th>Vehicle</th><th>Expiring / expired</th></tr>';
  const rows = await api('/admin/api/compliance/expiring?days=30');
  $('empty').style.display = rows.length ? 'none' : 'block';
  $('list').innerHTML = rows.map((r) => `
    <tr class="row" data-id="${esc(r.driver.driver_id)}">
      <td><b>${esc(r.driver.name)}</b><br><span class="muted">${esc(r.driver.driver_id)}</span></td>
      <td>${esc(r.driver.phone)}</td>
      <td>${esc(r.driver.vehicle_type)}<br><span class="muted">${esc(r.driver.vehicle_number)}</span></td>
      <td>${r.items.map((i) => `<div style="color:${i.days_left < 0 ? 'var(--red)' : 'var(--amber)'}">${esc(i.label)}: ${esc(i.date)} (${i.days_left < 0 ? 'expired ' + (-i.days_left) + ' days ago' : i.days_left + ' days left'})</div>`).join('')}</td>
    </tr>`).join('');
  $('list').querySelectorAll('tr.row').forEach((r) => r.onclick = () => openDriver(r.dataset.id));
}

function field(id, label, value, type = 'text') {
  return `<div><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value || '')}"></div>`;
}

async function openDriver(id) {
  try {
    const { driver: d, documents, required, police_required, compliance_details: c0, compliance } = await api('/admin/api/drivers/' + encodeURIComponent(id));
    const c = c0 || {};
    const have = documents.map((x) => x.doc_type);
    const missing = required.filter((t) => !have.includes(t));
    $('detail').style.display = 'block';
    $('detail').innerHTML = `
      <h2 style="margin-top:0">${esc(d.name)} <span class="badge ${esc(d.status)}">${esc(d.status.replace('_', ' '))}</span></h2>
      <div class="muted">${esc(d.driver_id)} · ${esc(d.phone)} · ${esc(d.vehicle_type)} ${esc(d.vehicle_number)} · police verification ${police_required ? 'REQUIRED' : 'not required for this vehicle type'}</div>
      ${d.rejection_reason ? `<p style="color:var(--red)">Rejected: ${esc(d.rejection_reason)}</p>` : ''}
      ${missing.length ? `<div class="issues bad">Missing documents: ${missing.map((m) => esc(NAMES[m])).join(', ')}</div>` : ''}
      <div class="docs">${documents.map((x) => `
        <div class="doc"><b>${esc(NAMES[x.doc_type] || x.doc_type)}${required.includes(x.doc_type) ? '' : ' (optional)'}</b>
          ${x.url ? (x.is_pdf ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">Open PDF</a>` : `<a href="${esc(x.url)}" target="_blank" rel="noopener"><img src="${esc(x.url)}" alt="${esc(x.doc_type)}"></a>`) : '<span class="muted">not available</span>'}
          <div class="muted">${new Date(x.uploaded_at).toLocaleString()}</div></div>`).join('')}</div>
      <p class="muted">Check that the name and photo match across selfie, licence and Aadhaar, that the licence and permit suit the vehicle type, and that the RC number matches what the driver entered. Document links expire after 10 minutes.</p>

      <h3>Licence, permit and insurance details</h3>
      <p class="muted">Type these in from the documents above. The driver cannot go online after any of these dates pass.</p>
      <div class="form">
        <div><label for="f_plate">Number plate type</label>
          <select id="f_plate"><option value="">Choose...</option>
            <option value="YELLOW" ${c.plate_type === 'YELLOW' ? 'selected' : ''}>Yellow (commercial)</option>
            <option value="GREEN" ${c.plate_type === 'GREEN' ? 'selected' : ''}>Green (electric)</option>
            <option value="OTHER" ${c.plate_type === 'OTHER' ? 'selected' : ''}>Other</option></select></div>
        ${field('f_dln', 'Driving licence number', c.dl_number)}
        ${field('f_dle', 'Driving licence expiry', c.dl_expiry, 'date')}
        ${field('f_badge', 'Badge number (if any)', c.badge_number)}
        ${field('f_pn', 'Permit number', c.permit_number)}
        ${field('f_pe', 'Permit expiry', c.permit_expiry, 'date')}
        ${field('f_ie', 'Insurance expiry', c.insurance_expiry, 'date')}
        ${field('f_fe', 'Fitness certificate expiry (optional)', c.fitness_expiry, 'date')}
      </div>
      <div class="actions"><button id="saveComp">Save details</button><span id="compMsg" class="muted"></span></div>
      <div id="issues"></div>

      <div class="actions">
        <label><input type="checkbox" id="pol" ${d.police_verified ? 'checked' : ''}> Police verification done</label>
        <button class="green" id="ok" ${missing.length ? 'disabled' : ''}>Approve - blue tick</button>
        <button class="red" id="no">Reject</button>
      </div>`;
    showIssues(compliance);

    $('saveComp').onclick = async () => {
      const body = { plate_type: $('f_plate').value, dl_number: $('f_dln').value, dl_expiry: $('f_dle').value, badge_number: $('f_badge').value,
        permit_number: $('f_pn').value, permit_expiry: $('f_pe').value, insurance_expiry: $('f_ie').value, fitness_expiry: $('f_fe').value };
      try { const r = await api(`/admin/api/drivers/${encodeURIComponent(id)}/compliance`, { method: 'POST', body: JSON.stringify(body) }); showIssues(r.compliance); $('compMsg').textContent = 'Saved'; }
      catch (er) { $('compMsg').textContent = ''; alert(er.message); }
    };
    $('pol').onchange = async (e) => { try { await api(`/admin/api/drivers/${encodeURIComponent(id)}/police`, { method: 'POST', body: JSON.stringify({ value: e.target.checked }) }); openDriver(id); loadList(); } catch (er) { alert(er.message); } };
    $('ok').onclick = async () => { if (!confirm('Approve ' + d.name + ' and give the blue tick?')) return;
      try { await api(`/admin/api/drivers/${encodeURIComponent(id)}/approve`, { method: 'POST', body: '{}' }); $('detail').style.display = 'none'; loadList(); } catch (er) { alert(er.message); } };
    $('no').onclick = async () => { const reason = prompt('Reason for rejection (the driver will see this):'); if (!reason) return;
      try { await api(`/admin/api/drivers/${encodeURIComponent(id)}/reject`, { method: 'POST', body: JSON.stringify({ reason }) }); $('detail').style.display = 'none'; loadList(); } catch (er) { alert(er.message); } };
    $('detail').scrollIntoView({ behavior: 'smooth' });
  } catch (e) { alert(e.message); }
}

function showIssues(c) {
  if (!c) return;
  const box = $('issues');
  let html = '';
  if (c.issues && c.issues.length) html += `<div class="issues bad"><b>Blocks approval / going online:</b><ul>${c.issues.map((i) => `<li>${esc(i)}</li>`).join('')}</ul></div>`;
  else html += '<div class="issues good">All documents and dates are in order.</div>';
  if (c.warnings && c.warnings.length) html += `<div class="issues warn"><b>Expiring soon:</b><ul>${c.warnings.map((i) => `<li>${esc(i)}</li>`).join('')}</ul></div>`;
  box.innerHTML = html;
}

if (KEY) { api('/admin/api/drivers?status=UNDER_REVIEW').then(start).catch(() => { sessionStorage.removeItem('adminKey'); }); }
</script>
</body>
</html>
